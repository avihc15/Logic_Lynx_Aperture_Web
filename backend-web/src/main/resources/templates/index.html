
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Aperture | Bienvenido</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="pagina-portada">

<main class="pagina-inicio">

    <section class="portada">

        <!-- PANEL CINEMATOGRÁFICO -->
        <div class="panel-cine">

            <div class="decoracion-cine"
                 aria-hidden="true">
                <span class="arco arco-uno"></span>
                <span class="arco arco-dos"></span>
                <span class="arco arco-tres"></span>
            </div>

            <div class="ambiente-cine">

                <div class="halo-cine"></div>

                <img
                        src="/img/sala-cine.png"
                        alt="Interior de una sala de cine"
                        class="imagen-cine"
                >

            </div>

        </div>

        <!-- PANEL DE BIENVENIDA -->
        <div class="panel-bienvenida">

            <div class="contenido-bienvenida">

                <div class="presentacion">

                    <span class="texto-bienvenida">
                        BIENVENIDO A
                    </span>

                    <div class="marca-aperture">

                        <img
                                src="/img/logo-aperture.png"
                                alt="Logotipo de Aperture"
                                class="logo-aperture"
                        >

                        <h1>Aperture</h1>

                    </div>

                    <h2>
                        Sistema de gestión para
                        cines independientes
                    </h2>

                    <p class="descripcion">
                        Centraliza la información de tus
                        sucursales, consulta la actividad
                        de cada área y mantén una visión
                        organizada de las operaciones
                        diarias, todo desde un mismo lugar.
                    </p>

                    <a href="/login" class="boton-acceso">
                        <span>Iniciar sesión</span>
                        <span class="flecha"
                              aria-hidden="true">
                            &rarr;
                        </span>
                    </a>

                </div>

            </div>

            <footer class="pie-bienvenida">
                <span>© 2026 Aperture</span>
                <span>Desarrollado por Logic Lynx</span>
            </footer>

        </div>

    </section>

</main>

</body>
</html>
